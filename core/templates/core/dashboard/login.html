<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="icon" type="image/png" href="{% static 'icons/icon.png' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/icon.png' %}">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060C08; --surface: #0D1711; --surface2: #131F18;
      --border: #1E3227; --accent: #1FBF8A; --accent2: #8B1A2E;
      --text: #E0EAE3; --text-muted: #6E8B7A; --text-dim: #3D5447;
      --font: 'Space Grotesk', sans-serif; --mono: 'JetBrains Mono', monospace;
      --radius: 12px; --tr: 0.22s cubic-bezier(0.4,0,0.2,1);
    }
    body {
      font-family: var(--font); background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .login-wrap {
      width: 100%; max-width: 420px;
    }
    .login-brand {
      text-align: center; margin-bottom: 2rem;
    }
    .login-brand .icon {
      width: 52px; height: 52px; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; margin: 0 auto 1rem;
    }
    .login-brand h1 { font-size: 1.4rem; font-weight: 700; }
    .login-brand p { color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem; }
    .login-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 2rem;
    }
    .form-group { margin-bottom: 1.125rem; }
    .form-label {
      display: block; font-size: 0.82rem; color: var(--text-muted);
      margin-bottom: 0.4rem; font-weight: 500;
    }
    .form-input {
      width: 100%; padding: 0.75rem 1rem;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: var(--font);
      font-size: 0.9rem; outline: none; transition: border-color var(--tr), box-shadow var(--tr);
    }
    .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(31,191,138,0.1); }
    .form-input::placeholder { color: var(--text-dim); }
    .btn-login {
      width: 100%; padding: 0.875rem;
      background: var(--accent); color: var(--bg);
      border: none; border-radius: 8px; font-family: var(--font);
      font-size: 0.95rem; font-weight: 700; cursor: pointer;
      transition: all var(--tr); margin-top: 0.25rem;
    }
    .btn-login:hover { background: #fff; transform: translateY(-1px); }
    .error-msg {
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.4);
      color: #FC8181; border-radius: 8px; padding: 0.75rem 1rem;
      font-size: 0.875rem; margin-bottom: 1.25rem;
    }
    .back-link {
      display: block; text-align: center; margin-top: 1.5rem;
      color: var(--text-muted); font-size: 0.85rem; text-decoration: none;
      transition: color var(--tr);
    }
    .back-link:hover { color: var(--accent); }
    .bg-glow {
      position: fixed; inset: 0; z-index: -1;
      background: radial-gradient(ellipse 60% 50% at 50% 30%, rgba(139,26,46,0.12), transparent 70%);
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="login-wrap">
    <div class="login-brand">
      <div class="icon">⚡</div>
      <h1>Dashboard</h1>
      <p>Sign in to manage your portfolio</p>
    </div>
    <div class="login-card">
      {% if error %}
      <div class="error-msg">{{ error }}</div>
      {% endif %}
      <form method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" name="username" class="form-input" placeholder="admin" required autofocus autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login">Sign In →</button>
      </form>
    </div>
    <a href="/" class="back-link">← Back to portfolio</a>
  </div>
</body>
</html>
